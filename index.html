      // Dynamic PWA manifest based on domain
      (function(){
        var isAdmin = window.location.hostname === 'pluspy.app' || window.location.hostname === 'www.pluspy.app';
        if (isAdmin) {
          var link = document.createElement('link');
          link.rel = 'manifest';
          link.href = '/manifest-admin.json';
          document.head.appendChild(link);
          // Override apple title for admin
          var meta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (meta) meta.content = 'PlusPy';
        }
      })();
    </script>
